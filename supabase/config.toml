project_id = "cbts-admissions"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/apply/dashboard"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[storage]
file_size_limit = "5MiB"

[functions.payment-webhook]
verify_jwt = false

[functions.referee-response]
verify_jwt = false

[functions.upload-document]
verify_jwt = true

[functions.document-access]
verify_jwt = true

[functions.send-referee-invites]
verify_jwt = true

[functions.create-payment]
verify_jwt = true

[functions.send-submission-confirmation]
verify_jwt = true

[functions.resend-verification]
verify_jwt = true
